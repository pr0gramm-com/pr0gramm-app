name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup git user
        run: |
          git config user.name "github actions"
          git config user.email "gh-actions@pr0gramm com"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decrypt keystore
        env:
          PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run:
          gpg --decrypt --batch --yes
            --passphrase "$PASSPHRASE"
            -o release.keystore release.keystore.gpg

      - name: Increase version
        run: |
          VERSION=$(( $(grep -Eo '[0-9]+' app/version.gradle.kts) + 1 ))
          echo "extra[\"appVersion\"] = $VERSION" > app/version.gradle.kts
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=1.$(( VERSION / 10 )).$(( VERSION % 10 ))" >> "$GITHUB_ENV"

      - name: Build release apk
        run: ./gradlew --console=plain --no-daemon assembleRelease

      - name: Verify apk
        run: unzip -t app/build/outputs/apk/release/app-release.apk | grep publicsuffixes.gz

      - name: Commit and tag version
        run: |
          git add app/version.gradle.kts
          git commit -m "Released version $VERSION"
          git tag -a "$TAG" -m "Released version $TAG"
          git push origin HEAD "$TAG"

      - name: Create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            app/build/outputs/apk/release/app-release.apk

      - name: Delete keystore file
        if: always()
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v7
        with:
          name: pr0gramm-app-debug.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
